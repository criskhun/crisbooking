<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173c34">
    <title>You’re offline — Davao Rent Zone</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; color: #18231f; background: radial-gradient(circle at 80% 15%, #e5f0d3 0, transparent 30%), #f6f3ea; }
        main { width: min(460px, 100%); padding: clamp(1.5rem, 6vw, 2.5rem); border: 1px solid #dfe5e1; border-radius: 24px; background: #fffefa; box-shadow: 0 24px 70px rgba(22, 54, 47, .13); text-align: center; }
        img { width: 5rem; height: 5rem; padding: .6rem; border-radius: 20px; background: #173c34; object-fit: contain; }
        h1 { margin: 1.25rem 0 .65rem; font-size: clamp(1.8rem, 7vw, 2.5rem); line-height: 1.05; letter-spacing: -.04em; }
        p { margin: 0; color: #66736e; line-height: 1.65; }
        button { width: 100%; min-height: 3rem; margin-top: 1.5rem; border: 0; border-radius: 12px; color: white; background: #173c34; font: inherit; font-weight: 800; cursor: pointer; }
        small { display: block; margin-top: 1rem; color: #78847f; }
        @media (prefers-color-scheme: dark) { body { color: #e8efec; background: #101512; } main { border-color: #2b3933; background: #19221e; box-shadow: none; } p, small { color: #a8b7b1; } }
    </style>
</head>
<body>
    <main>
        <img src="images/davao-rent-zone-logo-mark-flat.png" alt="Davao Rent Zone">
        <h1>You’re currently offline</h1>
        <p>Reconnect to the internet to view live availability, bookings, inquiries, and account details.</p>
        <button type="button" onclick="location.reload()">Try again</button>
        <small>Your private booking information is never stored for offline viewing.</small>
    </main>
</body>
</html>
